<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#1a2e1a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Tree Seeker"/>
<title>Tree Seeker</title>
<link rel="manifest" href="./manifest.json"/>
<link rel="apple-touch-icon" href="./icon-192.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bark: #1a2e1a;
  --bark-mid: #2d4a2d;
  --bark-light: #3d6b3d;
  --leaf: #5a8a3a;
  --leaf-light: #7ab55a;
  --cream: #f5f0e8;
  --parchment: #ede6d3;
  --ink: #1c1c18;
  --ink-mid: #4a4a42;
  --ink-light: #888878;
  --found-bg: #e8f5d8;
  --found-border: #5a8a3a;
  --found-text: #2d4a1a;
  --r: 12px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; overscroll-behavior: none; }
.app-header {
  background: var(--bark); color: var(--cream);
  padding: calc(var(--safe-top) + 14px) 20px 14px;
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 12px;
}
.app-icon { font-size: 24px; line-height: 1; }
.app-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; flex: 1; }
.sync-btn {
  background: rgba(255,255,255,0.12); border: none; color: var(--cream);
  padding: 6px 12px; border-radius: 20px; font-size: 12px; font-family: 'DM Sans', sans-serif;
  cursor: pointer; display: flex; align-items: center; gap: 6px;
}
.sync-btn:active { transform: scale(0.96); }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--leaf-light); }
.stats-bar { background: var(--bark-mid); color: var(--cream); display: flex; }
.stat-item { flex: 1; text-align: center; padding: 10px 4px; border-right: 1px solid rgba(255,255,255,0.08); }
.stat-item:last-child { border-right: none; }
.stat-num { font-size: 20px; font-weight: 500; font-family: 'Playfair Display', serif; }
.stat-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.6; margin-top: 1px; }
.progress-wrap { background: var(--bark); height: 3px; }
.progress-fill { height: 3px; background: var(--leaf-light); transition: width 0.6s ease; }
.controls {
  padding: 14px 16px 10px; background: var(--parchment);
  border-bottom: 1px solid rgba(0,0,0,0.08);
  display: flex; flex-direction: column; gap: 10px;
  position: sticky; top: calc(var(--safe-top) + 50px); z-index: 40;
}
.search-wrap {
  display: flex; align-items: center;
  background: white; border: 1px solid rgba(0,0,0,0.12); border-radius: 10px; padding: 0 12px;
}
.search-wrap svg { flex-shrink: 0; opacity: 0.4; }
.search-wrap input {
  border: none; background: none; padding: 11px 10px; flex: 1;
  font-size: 15px; font-family: 'DM Sans', sans-serif; color: var(--ink); outline: none;
}
.filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.filter-row::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; padding: 6px 14px; border-radius: 20px;
  font-size: 13px; font-family: 'DM Sans', sans-serif;
  border: 1.5px solid rgba(0,0,0,0.15); background: white; color: var(--ink-mid); cursor: pointer;
}
.chip.active { background: var(--bark); color: white; border-color: var(--bark); }
.chip:active { transform: scale(0.96); }
.tree-list { padding: 12px 16px calc(var(--safe-bottom) + 80px); display: flex; flex-direction: column; gap: 8px; }
.tree-card {
  background: white; border-radius: var(--r); border: 1.5px solid rgba(0,0,0,0.07);
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer;
}
.tree-card:active { transform: scale(0.985); }
.tree-card.found { background: var(--found-bg); border-color: var(--found-border); }
.check-ring {
  width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%;
  border: 2px solid rgba(0,0,0,0.18); background: none;
  display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;
}
.tree-card.found .check-ring { background: var(--leaf); border-color: var(--leaf); }
.check-ring svg { opacity: 0; transition: opacity 0.2s; }
.tree-card.found .check-ring svg { opacity: 1; }
.tree-body { flex: 1; min-width: 0; }
.tree-name { font-size: 14px; font-weight: 500; font-family: 'Playfair Display', serif; font-style: italic; color: var(--ink); line-height: 1.3; }
.tree-sub { font-size: 12px; color: var(--ink-light); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree-found-date { font-size: 11px; color: var(--found-text); margin-top: 3px; font-weight: 500; }
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  background: white; border-top: 1px solid rgba(0,0,0,0.1);
  display: flex; padding-bottom: var(--safe-bottom);
}
.nav-btn {
  flex: 1; padding: 10px 4px; border: none; background: none;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--ink-light); font-family: 'DM Sans', sans-serif;
  font-size: 10px; cursor: pointer; letter-spacing: 0.04em; text-transform: uppercase;
}
.nav-btn.active { color: var(--bark); }
.nav-btn svg { width: 22px; height: 22px; }
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.5);
  display: flex; align-items: flex-end;
  opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal-sheet {
  background: white; width: 100%; border-radius: 20px 20px 0 0;
  padding: 8px 0 calc(var(--safe-bottom) + 24px);
  transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
  max-height: 85vh; overflow-y: auto;
}
.modal-overlay.open .modal-sheet { transform: translateY(0); }
.modal-handle { width: 36px; height: 4px; background: rgba(0,0,0,0.15); border-radius: 2px; margin: 0 auto 16px; }
.modal-body { padding: 0 20px; }
.modal-num { font-size: 12px; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
.modal-title { font-family: 'Playfair Display', serif; font-size: 22px; font-style: italic; line-height: 1.3; margin-bottom: 4px; }
.modal-common { font-size: 14px; color: var(--ink-mid); margin-bottom: 20px; }
.modal-rows { display: flex; flex-direction: column; gap: 0; border-top: 1px solid rgba(0,0,0,0.06); }
.modal-row { display: flex; padding: 13px 0; gap: 12px; border-bottom: 1px solid rgba(0,0,0,0.06); align-items: flex-start; }
.modal-row-lbl { font-size: 12px; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.06em; min-width: 72px; padding-top: 1px; }
.modal-row-val { font-size: 14px; color: var(--ink); flex: 1; line-height: 1.5; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.btn-found {
  flex: 1; padding: 14px; border-radius: 12px; border: none;
  font-size: 15px; font-family: 'DM Sans', sans-serif; font-weight: 500; cursor: pointer;
  background: var(--bark); color: white;
}
.btn-found:active { transform: scale(0.97); }
.btn-found.is-found { background: var(--found-bg); color: var(--found-text); border: 1.5px solid var(--found-border); }
.btn-map { padding: 14px 20px; border-radius: 12px; border: 1.5px solid rgba(0,0,0,0.15); background: white; font-size: 15px; font-family: 'DM Sans', sans-serif; cursor: pointer; color: var(--ink); text-decoration: none; display: flex; align-items: center; }
.empty-state { text-align: center; padding: 48px 24px; color: var(--ink-light); }
.empty-state svg { margin: 0 auto 12px; display: block; opacity: 0.3; }
.tree-card.gone { border-color: #c0392b; background: #fff5f5; }
.tree-card.gone .tree-name { color: #7a1a1a; }
.note-banner { font-size: 12px; padding: 6px 10px; border-radius: 8px; margin-top: 6px; line-height: 1.4; }
.note-banner.warning { background: #fff3cd; color: #7a5c00; }
.note-banner.gone { background: #fde8e8; color: #7a1a1a; }
.empty-state p { font-size: 15px; line-height: 1.6; }
.sync-panel { padding: 20px; }
.sync-panel h2 { font-family: 'Playfair Display', serif; font-size: 18px; margin-bottom: 8px; }
.sync-panel p { font-size: 14px; color: var(--ink-mid); line-height: 1.6; margin-bottom: 16px; }
.sync-code { background: var(--parchment); border-radius: 8px; padding: 12px 16px; font-family: monospace; font-size: 12px; word-break: break-all; margin-bottom: 12px; border: 1px solid rgba(0,0,0,0.1); max-height: 100px; overflow-y: auto; }
.sync-input { width: 100%; padding: 12px; border: 1.5px solid rgba(0,0,0,0.15); border-radius: 10px; font-family: monospace; font-size: 13px; margin-bottom: 12px; outline: none; }
.sync-input:focus { border-color: var(--leaf); }
.btn-sync { width: 100%; padding: 13px; background: var(--bark); color: white; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; font-family: 'DM Sans', sans-serif; margin-bottom: 10px; }

#map-view { padding-top: env(safe-area-inset-top, 0px); }
.leaflet-container { font-family: 'DM Sans', sans-serif; }
.map-popup { min-width: 180px; }
.map-popup-name { font-family: 'Playfair Display', serif; font-size: 14px; font-style: italic; font-weight: 500; margin-bottom: 4px; }
.map-popup-sub { font-size: 12px; color: #888878; margin-bottom: 10px; }
.map-popup-btn { display: inline-block; padding: 7px 14px; background: #1a2e1a; color: white; border-radius: 8px; font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; border: none; width: 100%; text-align: center; }
.map-popup-btn.found { background: #e8f5d8; color: #2d4a1a; border: 1.5px solid #5a8a3a; }

.btn-sync-sec { width: 100%; padding: 13px; background: white; color: var(--ink); border: 1.5px solid rgba(0,0,0,0.15); border-radius: 10px; font-size: 15px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body>

<header class="app-header">
  <span class="app-icon">🌳</span>
  <span class="app-title">Tree Seeker</span>
  <button class="sync-btn" onclick="openSync()">
    <span class="sync-dot"></span>
    <span>Sync</span>
  </button>
</header>

<div class="stats-bar">
  <div class="stat-item"><div class="stat-num" id="s-found">0</div><div class="stat-lbl">Found</div></div>
  <div class="stat-item"><div class="stat-num" id="s-left">1000</div><div class="stat-lbl">Left</div></div>
  <div class="stat-item"><div class="stat-num" id="s-pct">0%</div><div class="stat-lbl">Progress</div></div>
  <div class="stat-item"><div class="stat-num" id="s-ch">–</div><div class="stat-lbl">Chapter</div></div>
</div>
<div class="progress-wrap"><div class="progress-fill" id="prog" style="width:0"></div></div>

<div class="controls">
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="search" id="search" placeholder="Name, #number, town, species…" oninput="render()" autocomplete="off" spellcheck="false"/>
  </div>
  <div class="filter-row" id="filter-row"></div>
</div>

<div class="tree-list" id="tree-list"></div>

<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-list" onclick="setView('list',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1.5"/><circle cx="3" cy="12" r="1.5"/><circle cx="3" cy="18" r="1.5"/></svg>
    List
  </button>
  <button class="nav-btn" id="nav-nearby" onclick="setView('nearby',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
    Near me
  </button>
  <button class="nav-btn" id="nav-found" onclick="setView('found',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
    Found
  </button>
  <button class="nav-btn" id="nav-map" onclick="setView('map',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3V7z"/><path d="M9 4v13M15 7v13"/></svg>
    Map
  </button>
</nav>


<div id="map-view" style="display:none;position:fixed;top:0;left:0;right:0;bottom:60px;z-index:10;">
  <div id="leaflet-map" style="width:100%;height:100%;"></div>
  <div id="map-legend" style="position:absolute;bottom:16px;left:16px;z-index:1000;background:white;border-radius:10px;padding:10px 14px;font-size:12px;font-family:'DM Sans',sans-serif;box-shadow:0 2px 8px rgba(0,0,0,0.15);">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><svg width="18" height="22" viewBox="0 0 28 34" style="flex-shrink:0"><ellipse cx="14" cy="13" rx="11" ry="10" fill="#5a8a3a" stroke="#2d4a1a" stroke-width="1.5"/><rect x="11.5" y="22" width="5" height="8" rx="2" fill="#2d4a1a"/></svg>Found</div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><svg width="18" height="22" viewBox="0 0 28 34" style="flex-shrink:0"><ellipse cx="14" cy="13" rx="11" ry="10" fill="#9a9a8a" stroke="#666656" stroke-width="1.5"/><rect x="11.5" y="22" width="5" height="8" rx="2" fill="#666656"/></svg>Not yet found</div>
    <div style="display:flex;align-items:center;gap:8px"><svg width="18" height="22" viewBox="0 0 28 34" style="flex-shrink:0"><ellipse cx="14" cy="13" rx="11" ry="10" fill="#c0392b" stroke="#7a1a1a" stroke-width="1.5"/><rect x="11.5" y="22" width="5" height="8" rx="2" fill="#7a1a1a"/></svg>Removed/lost</div>
  </div>
</div>

<div class="modal-overlay" id="modal" onclick="maybeClose('modal',event)">
  <div class="modal-sheet"><div class="modal-handle"></div><div class="modal-body" id="modal-body"></div></div>
</div>

<div class="modal-overlay" id="sync-modal" onclick="maybeClose('sync-modal',event)">
  <div class="modal-sheet"><div class="modal-handle"></div><div class="sync-panel" id="sync-panel"></div></div>
</div>

  {n:998,ch:18,town:'Wexford',name:'Immaculate Deodar',common:'Deodar',botanical:'Cedrus deodara',addr:'Church of the Immaculate Conception, Rowe Street Upper, Wexford, Y35 KX66',w3w:'sunrise.scowled.roadshow',lat:52.338926,lng:-6.464138},
  {n:999,ch:18,town:'Wexford',name:'Willie Redmond\'s Silver Lime',common:'Silver lime',botanical:'Tilia tomentosa',addr:'William Redmond Memorial Park, Spawell Rd, Townparks, Wexford, Y35 KN62',w3w:'sunrise.scowled.roadshow',lat:52.338926,lng:-6.464138},
  {n:1000,ch:18,town:'Rosslare',name:'Seaside Cypress',common:'Monterrey Cypress',botanical:'Cupressus macrocarpa',addr:'Doogans Warren, Rosslare, Co. Wexford, Y35 Y83V',w3w:'implore.rewarm.lift',lat:52.276021,lng:-6.388368},
];

const TOTAL = 1000;
const CHAPTERS = {1:'Scotland N & Highlands',2:'Scotland E & Edinburgh',3:'Scotland W & Glasgow',4:'Northumberland & Cumbria',5:'Lancashire & Manchester',6:'Yorkshire',7:'Nottinghamshire & Derbyshire',8:'Shropshire & W Midlands',9:'East Anglia',10:'London',11:'Home Counties & Surrey',12:'Oxfordshire & Berkshire',13:'Gloucestershire & SW',14:'Devon & Cornwall',15:'South Wales',16:'North Wales',17:'Northern Ireland',18:'Ireland'};
let found = {}, activeChip = '', view = 'list', userLat = null, userLng = null, activeModal = null;
const KEY = 'treeseeker_v2';

try { const s = localStorage.getItem(KEY); if(s) found = JSON.parse(s); } catch(e){}
function save() { try { localStorage.setItem(KEY, JSON.stringify(found)); } catch(e){} }

// Build chapter chips
const fr = document.getElementById('filter-row');
const chips = [
  {val:'',label:'All'},
  {val:'found',label:'✓ Found'},
  ...Object.entries(CHAPTERS).map(([k,v])=>({val:k,label:`Ch.${k} ${v}`}))
];
chips.forEach(({val,label}) => {
  const b = document.createElement('button');
  b.className = 'chip' + (val===''?' active':'');
  b.dataset.val = val;
  b.textContent = label;
  b.onclick = () => { activeChip = val; document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); b.classList.add('active'); render(); };
  fr.appendChild(b);
});

function dist(a,b,c,d){const R=6371,dL=(c-a)*Math.PI/180,dN=(d-b)*Math.PI/180,e=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dN/2)**2;return R*2*Math.atan2(Math.sqrt(e),Math.sqrt(1-e));}

function setView(v, btn) {
  view = v;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(v==='nearby') {
    // activate nearby chip
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    const allChip = document.querySelector('[data-val=""]');
    if(allChip) allChip.classList.add('active');
    activeChip = '';
    if(!userLat) {
      navigator.geolocation.getCurrentPosition(
        p=>{userLat=p.coords.latitude;userLng=p.coords.longitude;render();},
        ()=>alert('Could not get location.')
      );
    } else render();
  } else if(v==='found') {
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    const fc = document.querySelector('[data-val="found"]');
    if(fc){fc.classList.add('active');activeChip='found';}
    render();
  } else if(v==='map') {
    document.getElementById('tree-list').style.display = 'none';
    document.getElementById('map-view').style.display = 'block';
    document.querySelector('.controls').style.display = 'none';
    setTimeout(()=>{ initMap(); if(leafletMap) leafletMap.invalidateSize(); }, 50);
    return;
  } else {
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    const ac = document.querySelector('[data-val=""]');
    if(ac){ac.classList.add('active');activeChip='';}
    render();
  }
  // leaving map view
  document.getElementById('map-view').style.display = 'none';
  document.getElementById('tree-list').style.display = 'flex';
  document.querySelector('.controls').style.display = 'flex';
}

function render() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  let trees = TREES.filter(t => {
    if(q && !`${t.n} ${t.name} ${t.town} ${t.common} ${t.botanical} ${t.addr} ${t.w3w}`.toLowerCase().includes(q)) return false;
    if(activeChip==='found' && !found[t.n]) return false;
    if(activeChip && activeChip!=='found' && String(t.ch)!==activeChip) return false;
    return true;
  });

  let subtitle = '';
  if(view==='nearby' && userLat) {
    trees.forEach(t => { t._dist = (t.lat&&t.lng) ? dist(userLat,userLng,t.lat,t.lng) : 9999; });
    trees = trees.filter(t=>t._dist<80).sort((a,b)=>a._dist-b._dist);
    subtitle = trees.length ? `${trees.length} within 80 km` : 'None nearby';
  }

  const fc = Object.keys(found).length;
  document.getElementById('s-found').textContent = fc;
  document.getElementById('s-left').textContent = TOTAL - fc;
  document.getElementById('s-pct').textContent = Math.round(fc/TOTAL*100)+'%';
  const chLabel = activeChip && activeChip!=='found' ? `Ch.${activeChip}` : (activeChip==='found'?'★':'All');
  document.getElementById('s-ch').textContent = chLabel;
  document.getElementById('prog').style.width = (fc/TOTAL*100)+'%';

  const list = document.getElementById('tree-list');
  if(!trees.length) {
    list.innerHTML = `<div class="empty-state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><p>${view==='nearby'&&!userLat?'Allow location access to see trees near you.':'No trees match.'}</p></div>`;
    return;
  }
  list.innerHTML = trees.slice(0,200).map(t => {
    const isF = !!found[t.n];
    const distTxt = (view==='nearby'&&t._dist<9999) ? `${t._dist.toFixed(1)} km · ` : '';
    const dateTxt = isF&&found[t.n].date ? `<div class="tree-found-date">✓ Found ${found[t.n].date}</div>` : '';
    const isGone = t.note && /removed|fell|felled|dead|died|gone/i.test(t.note);
    const hasNote = !!t.note;
    const noteIcon = isGone ? ' ⚠️' : hasNote ? ' 📝' : '';
    return `<div class="tree-card${isF?' found':''}${isGone?' gone':''}" onclick="openTree(${t.n})">
      <button class="check-ring" onclick="event.stopPropagation();toggle(${t.n})" aria-label="Toggle found">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
      <div class="tree-body">
        <div class="tree-name">${t.name}${noteIcon}</div>
        <div class="tree-sub">${distTxt}#${t.n} · ${t.town} · ${t.common}</div>
        ${dateTxt}
      </div>
    </div>`;
  }).join('') + (trees.length>200?`<div style="text-align:center;padding:16px;color:var(--ink-light);font-size:13px">Showing 200 of ${trees.length} — use search to narrow down</div>`:'');
}

function toggle(n) {
  if(found[n]) delete found[n];
  else { const d=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); found[n]={date:d}; }
  save(); render();
  if(activeModal===n) openTree(n);
}

function openTree(n) {
  activeModal = n;
  const t = TREES.find(x=>x.n===n); if(!t) return;
  const isF = !!found[n];
  const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${t.lat},${t.lng}`;
  const w3wUrl = `https://what3words.com/${t.w3w}`;
  document.getElementById('modal-body').innerHTML = `
    <div class="modal-num">Tree #${t.n} · Chapter ${t.ch} · ${CHAPTERS[t.ch]||''}</div>
    <div class="modal-title">${t.name}</div>
    <div class="modal-common">${t.common} · <em style="font-style:italic">${t.botanical}</em></div>
    <div class="modal-rows">
      <div class="modal-row"><span class="modal-row-lbl">Town</span><span class="modal-row-val">${t.town}</span></div>
      <div class="modal-row"><span class="modal-row-lbl">Address</span><span class="modal-row-val">${t.addr}</span></div>
      ${t.w3w?`<div class="modal-row"><span class="modal-row-lbl">What3Words</span><span class="modal-row-val"><a href="${w3wUrl}" style="color:var(--leaf);text-decoration:none">///&#8202;${t.w3w}</a></span></div>`:''}
      ${isF&&found[n].date?`<div class="modal-row"><span class="modal-row-lbl">Found</span><span class="modal-row-val" style="color:var(--found-text)">${found[n].date}</span></div>`:''}
      ${t.note?`<div class="modal-row"><span class="modal-row-lbl">Note</span><span class="modal-row-val"><span class="note-banner ${/removed|fell|felled|dead|died|gone/i.test(t.note)?'gone':'warning'}">${t.note}</span></span></div>`:''}
    </div>
    <div class="modal-actions">
      <button class="btn-found${isF?' is-found':''}" onclick="toggle(${n})">${isF?'✓ Unmark':'Mark as found ✓'}</button>
      ${t.lat?`<a class="btn-map" href="${mapsUrl}">🗺 Map</a>`:''}
    </div>
    ${isF ? `
    <div style="margin-top:16px;border-top:1px solid rgba(0,0,0,0.06);padding-top:16px;">
      <div style="font-size:12px;color:var(--ink-light);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;font-weight:500">Visit details</div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <label style="font-size:13px;color:var(--ink-mid);min-width:48px;">Date</label>
          <input type="date" id="visit-date-${n}" value="${found[n].visitDate||''}" onchange="saveVisitDate(${n},this.value)"
            style="flex:1;padding:8px 10px;border:1px solid rgba(0,0,0,0.15);border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif;color:var(--ink);background:white;"/>
        </div>
        <div>
          <label style="font-size:13px;color:var(--ink-mid);display:block;margin-bottom:6px;">Photo</label>
          ${found[n].photo ? `
            <div style="position:relative;margin-bottom:8px;">
              <img src="${found[n].photo}" style="width:100%;border-radius:10px;max-height:200px;object-fit:cover;" />
              <button onclick="removePhoto(${n})" style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.5);color:white;border:none;border-radius:20px;padding:4px 10px;font-size:12px;cursor:pointer;">Remove</button>
            </div>` : ''}
          <label style="display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border:1.5px dashed rgba(0,0,0,0.2);border-radius:10px;cursor:pointer;font-size:13px;color:var(--ink-mid);">
            📷 ${found[n].photo ? 'Replace photo' : 'Add a photo'}
            <input type="file" accept="image/*" capture="environment" style="display:none" onchange="savePhoto(${n},this)"/>
          </label>
        </div>
      </div>
    </div>` : ''}
    <div style="text-align:center;margin-top:12px">
      <button onclick="document.getElementById('modal').classList.remove('open')" style="background:none;border:none;color:var(--ink-light);font-size:13px;cursor:pointer;padding:8px">Close</button>
    </div>
  `;
  document.getElementById('modal').classList.add('open');
}

function maybeClose(id, e) { if(e.target===document.getElementById(id)) document.getElementById(id).classList.remove('open'); }

function openSync() {
  const data = JSON.stringify(found);
  const count = Object.keys(found).length;
  document.getElementById('sync-panel').innerHTML = `
    <h2>Sync progress</h2>
    <p>Copy your progress code and paste it on another device (or share with Gary via WhatsApp).</p>
    <div style="font-size:12px;color:var(--ink-light);margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:.05em">Your progress · ${count} trees found</div>
    <div class="sync-code" id="scode">${count===0?'No trees found yet — get outside! 🌳':data}</div>
    <button class="btn-sync" onclick="copySyncCode()">Copy to clipboard</button>
    <div style="font-size:12px;color:var(--ink-light);margin:16px 0 6px;font-weight:500;text-transform:uppercase;letter-spacing:.05em">Import from another device</div>
    <textarea class="sync-input" id="sinput" rows="4" placeholder="Paste code here…"></textarea>
    <button class="btn-sync" onclick="importSync()">Import & merge</button>
    <button class="btn-sync-sec" onclick="document.getElementById('sync-modal').classList.remove('open')">Close</button>
  `;
  document.getElementById('sync-modal').classList.add('open');
}

function copySyncCode() {
  const text = document.getElementById('scode').textContent;
  navigator.clipboard.writeText(text)
    .then(()=>alert('Copied! Paste this on your other device.'))
    .catch(()=>alert('Copy failed — please select and copy the code manually.'));
}

function importSync() {
  try {
    const raw = document.getElementById('sinput').value.trim();
    if(!raw) { alert('Please paste a progress code first.'); return; }
    const imported = JSON.parse(raw);
    const before = Object.keys(found).length;
    found = {...found,...imported};
    save(); render();
    document.getElementById('sync-modal').classList.remove('open');
    alert(`Done! Merged to ${Object.keys(found).length} trees found (was ${before}).`);
  } catch(e) { alert('Invalid code — please paste the full progress code.'); }
}


let leafletMap = null;
let markers = {};

function initMap() {
  if(leafletMap) { refreshMarkers(); return; }
  leafletMap = L.map('leaflet-map', {zoomControl: true}).setView([54.5, -3.5], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(leafletMap);

  TREES.forEach(t => {
    if(!t.lat || !t.lng) return;
    const isF = !!found[t.n];
    const isGone = t.note && /removed|fell|felled|dead|died|gone/i.test(t.note);
    const marker = L.marker([t.lat, t.lng], {icon: treeIcon(isF, isGone)})
      .addTo(leafletMap)
      .bindPopup(() => makePopup(t.n), {maxWidth: 240, className: 'tree-popup'});
    markers[t.n] = marker;
  });
}

function treeIcon(isFound, isGone) {
  const color = isFound ? '#5a8a3a' : isGone ? '#c0392b' : '#9a9a8a';
  const stroke = isFound ? '#2d4a1a' : isGone ? '#7a1a1a' : '#666656';
  const highlight = isFound ? '#7ab55a' : isGone ? '#e74c3c' : '#b0b0a0';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="34" viewBox="0 0 28 34">
    <ellipse cx="14" cy="13" rx="11" ry="10" fill="${color}" stroke="${stroke}" stroke-width="1.5"/>
    <ellipse cx="14" cy="10" rx="8" ry="7" fill="${highlight}" opacity="0.5"/>
    <rect x="11.5" y="22" width="5" height="10" rx="2" fill="${stroke}"/>
  </svg>`;
  return L.divIcon({
    html: svg,
    className: '',
    iconSize: [28, 34],
    iconAnchor: [14, 34],
    popupAnchor: [0, -34]
  });
}

function makePopup(n) {
  const t = TREES.find(x=>x.n===n);
  const isF = !!found[n];
  const div = document.createElement('div');
  div.className = 'map-popup';
  div.innerHTML = `
    <div class="map-popup-name">${t.name}</div>
    <div class="map-popup-sub">#${t.n} · ${t.town} · ${t.common}</div>
    <button class="map-popup-btn${isF?' found':''}" onclick="toggleFromMap(${n})">${isF?'✓ Found — tap to unmark':'Mark as found ✓'}</button>
    <div style="text-align:center;margin-top:6px"><a href="https://what3words.com/${t.w3w}" style="font-size:11px;color:#5a8a3a;text-decoration:none">///&#8202;${t.w3w}</a></div>
  `;
  return div;
}

function toggleFromMap(n) {
  toggle(n);
  // refresh this marker style
  if(markers[n]) {
    const tg = TREES.find(x=>x.n===n);
    const tgGone = tg && tg.note && /removed|fell|felled|dead|died|gone/i.test(tg.note);
    markers[n].setIcon(treeIcon(!!found[n], tgGone));
    markers[n].closePopup();
    setTimeout(() => markers[n].openPopup(), 50);
  }
}

function refreshMarkers() {
  Object.entries(markers).forEach(([n, marker]) => {
    const tt = TREES.find(x=>x.n===parseInt(n));
    const tGone = tt && tt.note && /removed|fell|felled|dead|died|gone/i.test(tt.note);
    marker.setIcon(treeIcon(!!found[parseInt(n)], tGone));
  });
}

function locateOnMap() {
  if(!leafletMap) return;
  leafletMap.locate({setView: true, maxZoom: 12});
}


function saveVisitDate(n, val) {
  if(found[n]) { found[n].visitDate = val; save(); }
}

function savePhoto(n, input) {
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    // Resize to max 800px wide to keep storage reasonable
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxW = 800;
      const scale = Math.min(1, maxW / img.width);
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      found[n].photo = canvas.toDataURL('image/jpeg', 0.75);
      save();
      openTree(n); // refresh modal
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function removePhoto(n) {
  if(found[n]) { delete found[n].photo; save(); openTree(n); }
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js', {scope: './'}).catch(()=>{});
render();
</script>
