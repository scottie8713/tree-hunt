<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#1a2e1a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Tree Hunt"/>
<title>Tree Hunt</title>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bark: #1a2e1a;
  --bark-mid: #2d4a2d;
  --bark-light: #3d6b3d;
  --leaf: #5a8a3a;
  --leaf-light: #7ab55a;
  --spring: #c8e6a0;
  --cream: #f5f0e8;
  --parchment: #ede6d3;
  --ink: #1c1c18;
  --ink-mid: #4a4a42;
  --ink-light: #888878;
  --found-bg: #e8f5d8;
  --found-border: #5a8a3a;
  --found-text: #2d4a1a;
  --r: 12px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
  overscroll-behavior: none;
}

/* Header */
.app-header {
  background: var(--bark);
  color: var(--cream);
  padding: calc(var(--safe-top) + 14px) 20px 14px;
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 12px;
}
.app-icon { font-size: 24px; line-height: 1; }
.app-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; letter-spacing: 0.01em; flex: 1; }
.sync-btn {
  background: rgba(255,255,255,0.12); border: none; color: var(--cream);
  padding: 6px 12px; border-radius: 20px; font-size: 12px; font-family: 'DM Sans', sans-serif;
  cursor: pointer; display: flex; align-items: center; gap: 6px;
}
.sync-btn:active { transform: scale(0.96); }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--leaf-light); }
.sync-dot.syncing { animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* Stats bar */
.stats-bar {
  background: var(--bark-mid);
  color: var(--cream);
  display: flex; gap: 0;
}
.stat-item {
  flex: 1; text-align: center; padding: 10px 4px;
  border-right: 1px solid rgba(255,255,255,0.08);
}
.stat-item:last-child { border-right: none; }
.stat-num { font-size: 20px; font-weight: 500; font-family: 'Playfair Display', serif; }
.stat-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.6; margin-top: 1px; }
.progress-wrap { background: var(--bark); height: 3px; }
.progress-fill { height: 3px; background: var(--leaf-light); transition: width 0.6s ease; }

/* Controls */
.controls {
  padding: 14px 16px 10px;
  background: var(--parchment);
  border-bottom: 1px solid rgba(0,0,0,0.08);
  display: flex; flex-direction: column; gap: 10px;
  position: sticky; top: calc(var(--safe-top) + 50px); z-index: 40;
}
.search-wrap {
  display: flex; align-items: center;
  background: white;
  border: 1px solid rgba(0,0,0,0.12);
  border-radius: 10px;
  padding: 0 12px;
}
.search-wrap svg { flex-shrink: 0; opacity: 0.4; }
.search-wrap input {
  border: none; background: none; padding: 11px 10px; flex: 1;
  font-size: 15px; font-family: 'DM Sans', sans-serif; color: var(--ink);
  outline: none;
}
.filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.filter-row::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; padding: 6px 14px; border-radius: 20px;
  font-size: 13px; font-family: 'DM Sans', sans-serif; font-weight: 400;
  border: 1.5px solid rgba(0,0,0,0.15); background: white; color: var(--ink-mid);
  cursor: pointer;
}
.chip.active { background: var(--bark); color: white; border-color: var(--bark); }
.chip:active { transform: scale(0.96); }

/* Tree list */
.tree-list { padding: 12px 16px calc(var(--safe-bottom) + 80px); display: flex; flex-direction: column; gap: 8px; }
.tree-card {
  background: white;
  border-radius: var(--r);
  border: 1.5px solid rgba(0,0,0,0.07);
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  cursor: pointer;
  transition: transform 0.12s, box-shadow 0.12s;
}
.tree-card:active { transform: scale(0.985); }
.tree-card.found {
  background: var(--found-bg);
  border-color: var(--found-border);
}
.check-ring {
  width: 32px; height: 32px; flex-shrink: 0;
  border-radius: 50%;
  border: 2px solid rgba(0,0,0,0.18);
  background: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s;
}
.tree-card.found .check-ring {
  background: var(--leaf);
  border-color: var(--leaf);
}
.check-ring svg { opacity: 0; transition: opacity 0.2s; }
.tree-card.found .check-ring svg { opacity: 1; }
.tree-body { flex: 1; min-width: 0; }
.tree-name {
  font-size: 14px; font-weight: 500;
  font-family: 'Playfair Display', serif; font-style: italic;
  color: var(--ink); line-height: 1.3;
}
.tree-sub { font-size: 12px; color: var(--ink-light); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree-found-date { font-size: 11px; color: var(--found-text); margin-top: 3px; font-weight: 500; }
.tree-num { font-size: 11px; color: var(--ink-light); font-weight: 300; }

/* Bottom nav */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  background: white;
  border-top: 1px solid rgba(0,0,0,0.1);
  display: flex;
  padding-bottom: var(--safe-bottom);
}
.nav-btn {
  flex: 1; padding: 10px 4px; border: none; background: none;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--ink-light); font-family: 'DM Sans', sans-serif;
  font-size: 10px; cursor: pointer; letter-spacing: 0.04em; text-transform: uppercase;
}
.nav-btn.active { color: var(--bark); }
.nav-btn svg { width: 22px; height: 22px; }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.5);
  display: flex; align-items: flex-end;
  opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal-sheet {
  background: white; width: 100%;
  border-radius: 20px 20px 0 0;
  padding: 8px 0 calc(var(--safe-bottom) + 24px);
  transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
  max-height: 85vh; overflow-y: auto;
}
.modal-overlay.open .modal-sheet { transform: translateY(0); }
.modal-handle { width: 36px; height: 4px; background: rgba(0,0,0,0.15); border-radius: 2px; margin: 0 auto 16px; }
.modal-body { padding: 0 20px; }
.modal-num { font-size: 12px; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
.modal-title { font-family: 'Playfair Display', serif; font-size: 22px; font-style: italic; line-height: 1.3; margin-bottom: 4px; }
.modal-common { font-size: 14px; color: var(--ink-mid); margin-bottom: 20px; }
.modal-rows { display: flex; flex-direction: column; gap: 0; border-top: 1px solid rgba(0,0,0,0.06); }
.modal-row {
  display: flex; padding: 13px 0; gap: 12px;
  border-bottom: 1px solid rgba(0,0,0,0.06);
  align-items: flex-start;
}
.modal-row-lbl { font-size: 12px; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.06em; min-width: 72px; padding-top: 1px; }
.modal-row-val { font-size: 14px; color: var(--ink); flex: 1; line-height: 1.5; }
.modal-row-val em { font-style: italic; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.btn-found {
  flex: 1; padding: 14px; border-radius: 12px; border: none;
  font-size: 15px; font-family: 'DM Sans', sans-serif; font-weight: 500; cursor: pointer;
  background: var(--bark); color: white; transition: transform 0.1s;
}
.btn-found:active { transform: scale(0.97); }
.btn-found.is-found { background: var(--found-bg); color: var(--found-text); border: 1.5px solid var(--found-border); }
.btn-map {
  padding: 14px 20px; border-radius: 12px;
  border: 1.5px solid rgba(0,0,0,0.15); background: white;
  font-size: 15px; font-family: 'DM Sans', sans-serif; cursor: pointer; color: var(--ink);
}
.btn-map:active { transform: scale(0.97); }

/* Near me empty state */
.empty-state { text-align: center; padding: 48px 24px; color: var(--ink-light); }
.empty-state svg { margin: 0 auto 12px; display: block; opacity: 0.3; }
.empty-state p { font-size: 15px; line-height: 1.6; }

/* Sync modal */
.sync-panel { padding: 20px; }
.sync-panel h2 { font-family: 'Playfair Display', serif; font-size: 18px; margin-bottom: 8px; }
.sync-panel p { font-size: 14px; color: var(--ink-mid); line-height: 1.6; margin-bottom: 16px; }
.sync-code {
  background: var(--parchment); border-radius: 8px; padding: 12px 16px;
  font-family: monospace; font-size: 13px; word-break: break-all; margin-bottom: 12px;
  border: 1px solid rgba(0,0,0,0.1);
}
.sync-input {
  width: 100%; padding: 12px; border: 1.5px solid rgba(0,0,0,0.15); border-radius: 10px;
  font-family: monospace; font-size: 13px; margin-bottom: 12px; outline: none;
}
.sync-input:focus { border-color: var(--leaf); }
.btn-sync-go { width: 100%; padding: 13px; background: var(--bark); color: white; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
</style>
</head>
<body>

<header class="app-header">
  <span class="app-icon">🌳</span>
  <span class="app-title">Tree Hunt</span>
  <button class="sync-btn" id="sync-btn" onclick="openSync()">

</header>

</div>
<div class="progress-wrap"><div class="progress-fill" id="prog" style="width:0"></div></div>

<div class="controls">

    <input type="search" id="search" placeholder="Name, town, species…" oninput="render()" autocomplete="off" autocorrect="off" spellcheck="false"/>
  </div>
  <div class="filter-row" id="filter-row">
    <button class="chip active" data-ch="" onclick="setChip(this,'')">All</button>

  </div>
</div>

<div class="tree-list" id="tree-list"></div>

<!-- Bottom nav -->
<nav class="bottom-nav">
  <button class="nav-btn active" onclick="setView('list')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1.5"/><circle cx="3" cy="12" r="1.5"/><circle cx="3" cy="18" r="1.5"/></svg>
    List
  </button>
  <button class="nav-btn" onclick="openMapAll()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3V7z"/><path d="M9 4v13M15 7v13"/></svg>
    Map
  </button>
  <button class="nav-btn" onclick="setView('found-view')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
    Found
  </button>
</nav>

<!-- Tree detail modal -->
<div class="modal-overlay" id="modal" onclick="maybeCloseModal(event)">
  <div class="modal-sheet" id="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- Sync modal -->
<div class="modal-overlay" id="sync-modal" onclick="maybeCloseSyncModal(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="sync-panel" id="sync-panel"></div>
  </div>
</div>

const TOTAL = 1000;
let found = {};
let activeChip = '';
let userLat = null, userLng = null;
let activeModal = null;
const STORAGE_KEY = 'treehunt_found_v1';

// Load from localStorage
function loadFound() {
  try { const s = localStorage.getItem(STORAGE_KEY); if(s) found = JSON.parse(s); } catch(e){}
}
function saveFound() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(found)); } catch(e){}
}
loadFound();

// Haversine distance in km
function dist(lat1,lng1,lat2,lng2) {
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function setChip(el, val) {
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  activeChip = val;
  render();
}

function setNearby(el) {
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  activeChip = 'nearby';
  if(!userLat) {
    navigator.geolocation.getCurrentPosition(
      p => { userLat=p.coords.latitude; userLng=p.coords.longitude; render(); },
      () => { alert('Could not get your location. Please allow location access.'); }
    );
  } else { render(); }
}

function setView(v) {
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  event.currentTarget.classList.add('active');
  if(v==='found-view') {
    const foundChip = document.querySelector('[data-ch="found"]');
    setChip(foundChip,'found');
  } else if(v==='list') {
    const allChip = document.querySelector('[data-ch=""]');
    setChip(allChip,'');
  }
}

function openMapAll() {
  window.open('https://www.google.com/maps/d/u/0/viewer?mid=1uwmaal827YpPX4UqXdbjUogzTbcGU8U','_blank');
}

function render() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  let trees = TREES.filter(t => {
    if(q && !`${t.name} ${t.town} ${t.common} ${t.botanical}`.toLowerCase().includes(q)) return false;
    if(activeChip==='found' && !found[t.n]) return false;
    if(activeChip==='nearby') {
      if(!userLat) return false;
      t._dist = dist(userLat,userLng,t.lat,t.lng);
      return t._dist < 80;
    }
    if(activeChip && activeChip!=='found' && activeChip!=='nearby' && String(t.ch)!==activeChip) return false;
    return true;
  });
  if(activeChip==='nearby') trees.sort((a,b)=>a._dist-b._dist);

  const foundCount = Object.keys(found).length;
  document.getElementById('s-found').textContent = foundCount;
  document.getElementById('s-left').textContent = TOTAL - foundCount;
  document.getElementById('s-pct').textContent = Math.round(foundCount/TOTAL*100)+'%';
  document.getElementById('prog').style.width = (foundCount/TOTAL*100)+'%';

  const list = document.getElementById('tree-list');
  if(!trees.length) {
    list.innerHTML = activeChip==='nearby' && !userLat
      ? `<div class="empty-state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg><p>Tap to allow location access<br/>and see trees near you.</p></div>`
      : `<div class="empty-state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><p>No trees match your search.</p></div>`;
    return;
  }

  list.innerHTML = trees.map(t => {
    const isF = !!found[t.n];
    const distTxt = (activeChip==='nearby'&&t._dist!==undefined) ? `${t._dist.toFixed(1)} km · ` : '';
    const dateTxt = isF && found[t.n].date ? `<div class="tree-found-date">✓ Found ${found[t.n].date}</div>` : '';
    return `<div class="tree-card${isF?' found':''}" onclick="openTree(${t.n})">
      <button class="check-ring" onclick="event.stopPropagation();toggle(${t.n})" aria-label="${isF?'Unmark':'Mark as found'}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
      <div class="tree-body">
        <div class="tree-name">${t.name}</div>
        <div class="tree-sub">${distTxt}#${t.n} · ${t.town} · ${t.common}</div>
        ${dateTxt}
      </div>
    </div>`;
  }).join('');
}

function toggle(n) {
  if(found[n]) { delete found[n]; }
  else { const d=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); found[n]={date:d}; }
  saveFound();
  render();
  if(activeModal===n) openTree(n); // refresh modal
}

function openTree(n) {
  activeModal = n;
  const t = TREES.find(x=>x.n===n);
  if(!t) return;
  const isF = !!found[n];
  const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${t.lat},${t.lng}`;
  const w3wUrl = `https://what3words.com/${t.w3w}`;
  document.getElementById('modal-body').innerHTML = `
    <div class="modal-num">Tree #${t.n} · Chapter ${t.ch}</div>
    <div class="modal-title">${t.name}</div>
    <div class="modal-common">${t.common} · <em>${t.botanical}</em></div>
    <div class="modal-rows">
      <div class="modal-row"><span class="modal-row-lbl">Town</span><span class="modal-row-val">${t.town}</span></div>
      <div class="modal-row"><span class="modal-row-lbl">Address</span><span class="modal-row-val">${t.addr}</span></div>
      <div class="modal-row"><span class="modal-row-lbl">What3Words</span><span class="modal-row-val"><a href="${w3wUrl}" style="color:var(--leaf);text-decoration:none">///&#8202;${t.w3w}</a></span></div>
      ${isF&&found[n].date?`<div class="modal-row"><span class="modal-row-lbl">Found</span><span class="modal-row-val" style="color:var(--found-text)">${found[n].date}</span></div>`:''}
    </div>
    <div class="modal-actions">
      <button class="btn-found${isF?' is-found':''}" onclick="toggle(${n})">${isF?'✓ Mark not found':'Mark as found ✓'}</button>
      <a class="btn-map" href="${mapsUrl}">🗺 Map</a>
    </div>
  `;
  document.getElementById('modal').classList.add('open');
}

function maybeCloseModal(e) {
  if(e.target===document.getElementById('modal')) { document.getElementById('modal').classList.remove('open'); activeModal=null; }
}

// Sync panel — export/import JSON string for cross-device
function openSync() {
  const data = JSON.stringify(found);
  const short = data.length < 20 ? 'No trees found yet' : `${Object.keys(found).length} trees found`;
  document.getElementById('sync-panel').innerHTML = `
    <h2>Sync found trees</h2>
    <p>Copy your progress code and paste it on another device to sync your found trees.</p>
    <div style="font-size:13px;color:var(--ink-light);margin-bottom:6px;font-weight:500">YOUR PROGRESS (${short})</div>
    <div class="sync-code" id="sync-code">${data}</div>
    <button style="width:100%;padding:11px;margin-bottom:16px;border:1.5px solid rgba(0,0,0,0.12);border-radius:10px;background:white;font-size:14px;cursor:pointer;font-family:'DM Sans',sans-serif" onclick="copySyncCode()">Copy to clipboard</button>
    <div style="font-size:13px;color:var(--ink-light);margin-bottom:6px;font-weight:500">PASTE PROGRESS FROM ANOTHER DEVICE</div>
    <textarea class="sync-input" id="sync-input" rows="4" placeholder='Paste code here…'></textarea>
    <button class="btn-sync-go" onclick="importSync()">Import progress</button>
  `;
  document.getElementById('sync-modal').classList.add('open');
}

function copySyncCode() {
  const text = document.getElementById('sync-code').textContent;
  navigator.clipboard.writeText(text).then(()=>{alert('Copied! Paste this on your other device.');}).catch(()=>{
    document.getElementById('sync-code').select?.();
  });
}

function importSync() {
  try {
    const raw = document.getElementById('sync-input').value.trim();
    const imported = JSON.parse(raw);
    found = {...found, ...imported};
    saveFound(); render();
    document.getElementById('sync-modal').classList.remove('open');
    alert(`Imported! You now have ${Object.keys(found).length} trees found.`);
  } catch(e) { alert('Invalid code — please paste the full progress code.'); }
}

function maybeCloseSyncModal(e) {
  if(e.target===document.getElementById('sync-modal')) document.getElementById('sync-modal').classList.remove('open');
}

// Service worker registration
if('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

render();
</script>
</body>
</html>
